version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_api
    command: >
      sh -c "python -m scripts.seed --no-reset &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/inventory.db}
    ports:
      - "8000:8000"
    volumes:
      - inventory_data:/app/data
      - inventory_logs:/app/logs
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_scheduler
    command: python -m scripts.run_scheduler
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/inventory.db}
    volumes:
      - inventory_data:/app/data
      - inventory_logs:/app/logs
    depends_on:
      - api
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_dashboard
    command: >
      streamlit run dashboard/app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/inventory.db}
    ports:
      - "8501:8501"
    volumes:
      - inventory_data:/app/data
      - inventory_logs:/app/logs
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: inventory_postgres
    profiles:
      - postgres
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  inventory_data:
  inventory_logs:
  pg_data:

